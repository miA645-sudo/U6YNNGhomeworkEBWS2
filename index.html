{p:5,w:"dopamine",t:"n",i:"ˈdəʊ.pə.miːn",d:"A chemical produced by nerve cells that plays a major role in pleasure and motivation",v:"Hormone hạnh phúc/hưng phấn dopamine",e:"On top of that, they produce higher levels of 'pleasure' chemicals like [[dopamine]]."},
{p:5,w:"sensitivity",t:"n",i:"ˌsen.sɪˈtɪv.ə.ti",d:"The quality of being easily affected by or responsive to certain stimuli",v:"Độ nhạy cảm, sự nhạy bén",e:"What's more, researchers have found that people with high sensation-seeking personalities have increased [[sensitivity]] to things that could be rewarding, like landing a perfect double cork 1080 in skateboarding, and decreased [[sensitivity]] to potential dangers, like the fear of wiping out after attempting a triple axel jump in figure skating."},

{p:8,w:"boil down to",t:"phr. v",i:"bɔɪl daʊn tuː",d:"To have something as the main or most basic part or reason",v:"Chung quy lại là, cốt lõi nằm ở",e:"Boredom susceptibility [[boils down to]] your ability to tolerate the absence of external stimuli."},

{p:8,w:"restless",t:"adj",i:"ˈrest.ləs",d:"Unable to stay still or be happy where you are, because you are bored or need a change",v:"Bồn chồn, đứng ngồi không yên",e:"They tire easily of the predictable or dull, and they get [[restless]] when forced to perform mundane, routine tasks."},

{p:9,w:"navigate",t:"v",i:"ˈnæv.ɪ.ɡeɪt",d:"To find a way through a difficult or complex situation or area",v:"Điều hướng, luồn lách vượt qua",e:"It's easy to see how all of these aspects of sensation-seeking personalities might exist in Olympic athletes, whether it's a snowboarder experimenting with a daring new trick or an ice hockey forward [[navigating]] a puck through a maze of defenders."},
{p:9,w:"puck",t:"n",i:"pʌk",d:"A small hard rubber disc used instead of a ball in ice hockey",v:"Đĩa khúc côn cầu trên băng",e:"It's easy to see how all of these aspects of sensation-seeking personalities might exist in Olympic athletes, whether it's a snowboarder experimenting with a daring new trick or an ice hockey forward navigating a [[puck]] through a maze of defenders."},

{p:9,w:"in one's element",say:"in their element",t:"idiom",i:"ɪn wʌnz ˈel.ɪ.mənt",d:"In a situation that suits someone completely because they are good at it and enjoy it",v:"Như cá gặp nước, ở đúng môi trường sở trường",e:"People with high sensation-seeking personalities in these situations are [[in their element]]."},
{p:9,w:"crumble",t:"v",i:"ˈkrʌm.bəl",d:"To suddenly lose power, effectiveness, or the ability to continue under pressure",v:"Sụp đổ, gục ngã",e:"Where a low sensation-seeking person might [[crumble]] under pressure and give up altogether, they thrive."},
{p:9,w:"altogether",t:"adv",i:"ˌɔːl.təˈɡeð.ər",d:"Completely; totally",v:"Hoàn toàn",e:"Where a low sensation-seeking person might crumble under pressure and give up [[altogether]], they thrive."},
{p:9,w:"thrive",t:"v",i:"θraɪv",d:"To grow, develop, or be successful, especially in challenging conditions",v:"Phát triển mạnh mẽ, thăng hoa",e:"Where a low sensation-seeking person might crumble under pressure and give up altogether, they [[thrive]]."}
];

const $ = s => document.querySelector(s);
const grid = $("#grid"), q = $("#q"), clearBtn = $("#clear"), statusEl = $("#status"), chipsEl = $("#chips");
let para = 0; // 0 = all

const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"d").toLowerCase().trim();
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const markEx = s => esc(s).replace(/\[\[(.+?)\]\]/g,"<mark>$1</mark>");
const posVar = t => {
  if (/^n\b/.test(t)) return "--pos-noun";
  if (/idiom/.test(t) || t === "phr") return "--pos-idiom";
  if (/^adv/.test(t)) return "--pos-adv";
  if (/^adj/.test(t)) return "--pos-adj";
  if (/v$/.test(t) || t === "v") return "--pos-verb";
  return "--pos-noun";
};
VOCAB.forEach(o => { o._k = norm(o.w + " " + o.v); });



/* paragraph chips */
const counts = {};
VOCAB.forEach(o => counts[o.p] = (counts[o.p] || 0) + 1);
const chipData = [[0,"All",VOCAB.length], ...Object.keys(counts).map(k => [+k, "Paragraph " + k, counts[k]])];
chipsEl.innerHTML = chipData.map(([n,l,c]) =>
  `<button class="chip" type="button" data-p="${n}" aria-pressed="${n===0}">${l}<span>${c}</span></button>`).join("");
chipsEl.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  para = +b.dataset.p;
  chipsEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  render();
});

/* speech */
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
let voice = null;
function pickVoice(){
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === "en-GB") || vs.find(v => /^en[-_]/i.test(v.lang)) || null;
}
if (canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, btn){
  if (!canSpeak) return;
  speechSynthesis.cancel();
  document.querySelectorAll(".speak.playing").forEach(b => b.classList.remove("playing"));
  const u = new SpeechSynthesisUtterance(text);
  u.lang = voice ? voice.lang : "en-GB"; if (voice) u.voice = voice; u.rate = .88;
  btn.classList.add("playing");
  u.onend = u.onerror = () => btn.classList.remove("playing");
  speechSynthesis.speak(u);
}
const speakIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" fill-opacity=".15"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;

function card(o, idx){
  const pc = posVar(o.t);
  const say = o.say || o.w;
  return `<article class="card" style="--pc:var(${pc});--i:${Math.min(idx,30)}">
    <div class="card-top">
      <div><h3 class="word">${esc(o.w)}<span class="pos">${esc(o.t)}</span></h3>
      <div class="ipa">/${esc(o.i)}/</div></div>
      ${canSpeak ? `<button class="speak" type="button" data-say="${esc(say)}" aria-label="Pronounce ${esc(o.w)}">${speakIcon}</button>` : ""}
    </div>
    <dl class="meanings">
      <div class="mrow"><dt>EN</dt><dd>${esc(o.d)}</dd></div>
      <div class="mrow"><dt>VI</dt><dd class="vi">${esc(o.v)}</dd></div>
    </dl>
    <figure class="ex"><figcaption>From the passage, paragraph ${o.p}</figcaption><blockquote>${markEx(o.e)}</blockquote></figure>
  </article>`;
}

function render(){
  const term = norm(q.value);
  clearBtn.classList.toggle("show", q.value.length > 0);
  const list = VOCAB.filter(o => (para === 0 || o.p === para) && (!term || o._k.includes(term)));
  const scope = para ? `paragraph ${para}` : "the whole passage";
  const unit = list.length === 1 ? "word" : "words";
  if (!list.length){
    grid.innerHTML = `<div class="empty"><strong>No words match “${esc(q.value)}”</strong>
      Try a shorter search, switch between English and Vietnamese, or search the whole passage.
      <br><button type="button" id="reset">Show all words</button></div>`;
    $("#reset").onclick = () => { q.value = ""; para = 0; chipsEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.p === "0")); render(); q.focus(); };
  } else {
    grid.innerHTML = list.map(card).join("");
  }
  statusEl.innerHTML = term
    ? `Found <b>${list.length}</b> ${unit} for “${esc(q.value.trim())}” in ${scope}`
    : `Showing <b>${list.length}</b> ${unit} from ${scope}`;
}

grid.addEventListener("click", e => {
  const b = e.target.closest(".speak"); if (b) speak(b.dataset.say, b);
});
q.addEventListener("input", () => { grid.classList.remove("intro"); render(); });
clearBtn.addEventListener("click", () => { q.value = ""; render(); q.focus(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if (e.key === "Escape" && document.activeElement === q){ q.value = ""; render(); }
});

render();
</script>
